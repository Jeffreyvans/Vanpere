{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for f in form %}<div class="field"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
{% if f.help_text %}<small>{{ f.help_text|safe }}</small>{% endif %}
{% for e in f.errors %}<p class="err" role="alert">{{ e }}</p>{% endfor %}</div>{% endfor %}
