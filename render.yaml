# VanPere Digital Render blueprint (not validated against Render; see README, Deployment).
# Render cron schedules are UTC. Africa/Harare is UTC+2 all year, so 00:00 UTC = 02:00 Harare.
envVarGroups:
  - name: vanpere-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: "Africa/Harare"
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ADDRESSING_STYLE
        value: "path"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_EVENT_EXPIRY_DAYS
        value: "90"
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: REPORT_AUTO_HIDE_THRESHOLD
        value: "3"
      - key: EXPIRY_WARNING_DAYS
        value: "7,1"
      - key: PURGE_GRACE_DAYS
        value: "14"
      - key: ORPHAN_MAX_AGE_HOURS
        value: "24"
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: vanpere-digital-db
    plan: basic-256mb
    databaseName: vanpere
    user: vanpere

services:
  - type: web
    name: vanpere-digital
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --worker-class gthread --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        fromDatabase:
          name: vanpere-digital-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
  - type: cron
    name: vanpere-digital-expire-events
    runtime: python
    plan: starter
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_events
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        fromDatabase:
          name: vanpere-digital-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
  - type: cron
    name: vanpere-digital-cleanup-orphans
    runtime: python
    plan: starter
    schedule: "30 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_orphans
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        fromDatabase:
          name: vanpere-digital-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
