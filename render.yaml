# VanPere Digital Render blueprint (not validated against Render; see README, Deployment).
# Render cron schedules are UTC. Africa/Harare is UTC+2 all year, so 00:00 UTC = 02:00 Harare.
envVarGroups:
  - name: vanpere-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: "Africa/Harare"
      - key: STORAGE_BACKEND
        value: "s3"
      # Filebase S3-compatible object storage (safe non-secret values).
      # Credentials are entered per service below, never stored in Git.
      - key: AWS_S3_ENDPOINT_URL
        value: "https://s3.filebase.io"
      - key: AWS_S3_REGION_NAME
        value: "auto"
      - key: AWS_STORAGE_BUCKET_NAME
        value: "vanpere"
      - key: AWS_S3_SIGNATURE_VERSION
        value: "s3v4"
      - key: AWS_S3_ADDRESSING_STYLE
        value: "path"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_EVENT_EXPIRY_DAYS
        value: "90"
      - key: LOGIN_MAX_FAILURES
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "15"
      - key: REPORT_AUTO_HIDE_THRESHOLD
        value: "3"
      - key: UPLOAD_RATE_PER_DEVICE
        value: "120"
      - key: UPLOAD_RATE_PER_IP
        value: "400"
      - key: COMMENT_RATE_PER_DEVICE
        value: "30"
      - key: COMMENT_RATE_PER_IP
        value: "120"
      - key: LIKE_RATE_PER_DEVICE
        value: "120"
      - key: LIKE_RATE_PER_IP
        value: "400"
      - key: MAX_IMAGE_UPLOAD_MB
        value: "100"
      - key: MAX_VIDEO_UPLOAD_MB
        value: "500"
      - key: VIDEO_PART_MB
        value: "8"
      - key: PREVIEW_EDGE
        value: "2000"
      - key: THUMB_EDGE
        value: "400"
      - key: POSTER_MAX_KB
        value: "500"
      - key: EXPIRY_WARNING_DAYS
        value: "7,1"
      - key: PURGE_GRACE_DAYS
        value: "14"
      - key: ORPHAN_MAX_AGE_HOURS
        value: "24"
      - key: SECRET_KEY
        generateValue: true

# Production database: the Render PostgreSQL instance `vanpere-database`, created in
# the Render Dashboard (NOT by this blueprint) and shared by the web service and both
# cron jobs through the private DATABASE_URL environment variable (sync: false below).
# The value is entered only in the Render Dashboard - never in this file, never in Git.
# Note: syncing a Blueprint never deletes an existing resource, so removing a resource
# definition here (e.g. the old `databases:` block) cannot destroy database data.
services:
  - type: web
    name: vanpere-digital
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --worker-class gthread --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      # Filebase credentials: set these in the Render dashboard only (never in Git).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
  - type: cron
    name: vanpere-digital-expire-events
    runtime: python
    plan: starter
    schedule: "0 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_events
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      # Filebase credentials: set these in the Render dashboard only (never in Git).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
  - type: cron
    name: vanpere-digital-cleanup-orphans
    runtime: python
    plan: starter
    schedule: "30 0 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_orphans
    envVars:
      - fromGroup: vanpere-shared
      - key: DATABASE_URL
        sync: false
      - key: SITE_URL
        sync: false
      # Filebase credentials: set these in the Render dashboard only (never in Git).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
